# Настройка готового ROS-узла twist_mux: больший priority побеждает среди свежих входов.
# timeout задаётся в секундах; нулевая скорость сама по себе не освобождает приоритет.
twist_mux:
  ros__parameters:
    topics:
      # Автономный регулятор публикует сюда команды движения к маркеру.
      navigation:
        topic: /cmd_vel_nav
        timeout: 0.3
        priority: 10
      # Ручной вход имеет преимущество. Router фильтрует повторные нули,
      # чтобы после отпускания управления этот вход мог устареть и уступить автономному.
      teleop:
        topic: /cmd_vel_teleop_active
        timeout: 0.15
        priority: 100
